<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dorking :: search console</title>
<style>
  @font-face {
    font-family: 'JBM';
    src: local('JetBrains Mono');
  }

  :root{
    --bg:#05070a;
    --panel:#0a0f0c;
    --border:#1c2b22;
    --border-hi:#2f4a37;
    --text:#e8fff0;
    --dim:#5f8a70;
    --green:#00ff9d;
    --green-dim:#08a86a;
    --amber:#ffb347;
    --red:#ff5f56;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;
    min-height:100vh;
    overflow-x:hidden;
  }

  canvas#rain{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    opacity:0.16;
    z-index:0;
  }

  .scanlines{
    pointer-events:none;
    position:fixed;
    inset:0;
    z-index:2;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.10) 3px
    );
    mix-blend-mode:multiply;
  }

  .vignette{
    pointer-events:none;
    position:fixed;
    inset:0;
    z-index:2;
    box-shadow:inset 0 0 180px rgba(0,0,0,0.75);
  }

  .wrap{
    position:relative;
    z-index:3;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 16px;
  }

  .term{
    width:100%;
    max-width:760px;
    background:var(--panel);
    border:1px solid var(--border-hi);
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.6),
      0 30px 80px rgba(0,0,0,0.65),
      0 0 60px rgba(0,255,157,0.05);
  }

  .titlebar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 14px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,#0d1410,#0a0f0c);
  }

  .dot{
    width:10px;height:10px;border-radius:50%;
    background:#233229;
    border:1px solid var(--border-hi);
  }
  .dot.live{background:var(--green-dim);}

  .titlebar .path{
    margin-left:8px;
    font-size:12px;
    color:var(--dim);
    letter-spacing:0.02em;
  }

  .screen{
    padding:26px 26px 30px;
    min-height:420px;
  }

  .boot-line{
    font-size:13px;
    color:var(--dim);
    line-height:1.7;
    white-space:pre-wrap;
  }
  .boot-line .ok{color:var(--green);}

  .hero{
    margin:22px 0 26px;
    font-size:15px;
    line-height:1.65;
    color:var(--text);
  }
  .hero .cursor{
    display:inline-block;
    width:9px;height:16px;
    background:var(--green);
    margin-left:2px;
    vertical-align:-2px;
    animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0;}}

  .field-row{
    display:flex;
    align-items:center;
    gap:10px;
    border:1px solid var(--border-hi);
    background:#060907;
    padding:12px 14px;
    margin-bottom:18px;
  }
  .field-row .prompt{color:var(--green);font-size:14px;flex-shrink:0;}
  .field-row input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-family:inherit;
    font-size:14px;
    caret-color:var(--green);
  }
  .field-row input::placeholder{color:#3c5546;}

  .built-query{
    font-size:12px;
    color:var(--dim);
    margin:-8px 0 20px 2px;
    min-height:16px;
    word-break:break-all;
  }
  .built-query span{color:var(--green-dim);}

  .run-btn{
    width:100%;
    padding:12px 14px;
    background:transparent;
    border:1px solid var(--green-dim);
    color:var(--green);
    font-family:inherit;
    font-size:13px;
    letter-spacing:0.04em;
    cursor:pointer;
    margin-bottom:28px;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .run-btn:hover{
    background:var(--green);
    color:#04120b;
  }
  .run-btn:active{transform:translateY(1px);}
  .run-btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

  .section-label{
    font-size:11px;
    color:var(--dim);
    margin-bottom:10px;
    border-bottom:1px solid var(--border);
    padding-bottom:8px;
  }

  .ops{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:8px;
    margin-bottom:24px;
  }
  .op{
    text-align:left;
    background:transparent;
    border:1px solid var(--border);
    color:var(--text);
    font-family:inherit;
    font-size:12px;
    padding:9px 10px;
    cursor:pointer;
    transition:border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .op b{color:var(--green);font-weight:400;}
  .op:hover{
    border-color:var(--green-dim);
    background:rgba(0,255,157,0.05);
  }
  .op .desc{display:block;color:var(--dim);font-size:10px;margin-top:3px;}

  .footer-note{
    font-size:11px;
    color:var(--dim);
    line-height:1.7;
    border-top:1px solid var(--border);
    padding-top:16px;
  }
  .footer-note .amber{color:var(--amber);}

  @media (prefers-reduced-motion: reduce){
    .hero .cursor{animation:none;opacity:1;}
    canvas#rain{display:none;}
  }

  @media (max-width:480px){
    .screen{padding:18px 16px 22px;}
    .ops{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>

<canvas id="rain"></canvas>
<div class="scanlines"></div>
<div class="vignette"></div>

<div class="wrap">
  <div class="term">
    <div class="titlebar">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot live"></span>
      <span class="path">guest@dorking: ~/search</span>
    </div>

    <div class="screen">
      <div class="boot-line" id="bootLine"></div>

      <div class="hero" id="hero" style="display:none;">
        Build a Google dork in seconds. Type a keyword, stack operators below, run it.<span class="cursor"></span>
      </div>

      <div class="field-row" id="fieldRow" style="display:none;">
        <span class="prompt">&gt;</span>
        <input id="queryInput" type="text" placeholder="e.g. admin login panel" autocomplete="off" spellcheck="false">
      </div>

      <div class="built-query" id="builtQuery" style="display:none;"></div>

      <button class="run-btn" id="runBtn" style="display:none;">[ RUN SEARCH ]</button>

      <div id="opsBlock" style="display:none;">
        <div class="section-label">operators — click to append</div>
        <div class="ops" id="opsGrid"></div>

        <div class="footer-note">
          Built for OSINT and security research on systems you own or are authorized to test.
          <span class="amber">Do not use this to access systems without permission.</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  // ---- matrix rain background ----
  var canvas = document.getElementById('rain');
  var ctx = canvas.getContext('2d');
  var w, h, cols, drops;
  var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ01<>/[]{}#$';

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    cols = Math.floor(w / 16);
    drops = new Array(cols).fill(0);
  }
  resize();
  window.addEventListener('resize', resize);

  function draw(){
    ctx.fillStyle = 'rgba(5,7,10,0.08)';
    ctx.fillRect(0,0,w,h);
    ctx.fillStyle = '#00ff9d';
    ctx.font = '14px monospace';
    for(var i=0;i<drops.length;i++){
      var ch = chars[Math.floor(Math.random()*chars.length)];
      ctx.fillText(ch, i*16, drops[i]*16);
      if(drops[i]*16 > h && Math.random() > 0.975){
        drops[i] = 0;
      }
      drops[i]++;
    }
  }
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduceMotion){
    setInterval(draw, 55);
  }

  // ---- boot sequence typing ----
  var bootText = [
    'booting dorking-console v1.0 ...',
    'loading search operators ... ok',
    'no target authorized yet — awaiting input'
  ];
  var bootEl = document.getElementById('bootLine');
  var full = bootText.join('\n');
  var idx = 0;

  function typeBoot(){
    if(idx <= full.length){
      bootEl.textContent = full.slice(0, idx);
      idx++;
      setTimeout(typeBoot, 14);
    } else {
      revealUI();
    }
  }

  function revealUI(){
    document.getElementById('hero').style.display = 'block';
    document.getElementById('fieldRow').style.display = 'flex';
    document.getElementById('builtQuery').style.display = 'block';
    document.getElementById('runBtn').style.display = 'block';
    document.getElementById('opsBlock').style.display = 'block';
    document.getElementById('queryInput').focus();
    updateQuery();
  }

  setTimeout(typeBoot, 250);

  // ---- dork operators ----
  var operators = [
    {tag:'site:', desc:'limit to a domain'},
    {tag:'filetype:pdf', desc:'match a file type'},
    {tag:'intitle:', desc:'word in page title'},
    {tag:'inurl:', desc:'word in the URL'},
    {tag:'intext:', desc:'word in page body'},
    {tag:'"index of"', desc:'open directory listings'},
    {tag:'ext:sql', desc:'match file extension'},
    {tag:'-inurl:', desc:'exclude URL pattern'},
    {tag:'cache:', desc:'view cached version'},
    {tag:'related:', desc:'similar sites'}
  ];

  var opsGrid = document.getElementById('opsGrid');
  operators.forEach(function(op){
    var btn = document.createElement('button');
    btn.className = 'op';
    btn.innerHTML = '<b>' + op.tag + '</b><span class="desc">' + op.desc + '</span>';
    btn.addEventListener('click', function(){
      var input = document.getElementById('queryInput');
      var sep = input.value.trim().length ? ' ' : '';
      input.value = input.value.trim() + sep + op.tag;
      input.focus();
      updateQuery();
    });
    opsGrid.appendChild(btn);
  });

  // ---- query preview + run ----
  var input = document.getElementById('queryInput');
  var preview = document.getElementById('builtQuery');

  function updateQuery(){
    var q = input.value.trim();
    if(!q){
      preview.innerHTML = 'query preview will appear here';
    } else {
      preview.innerHTML = 'google.com/search?q=<span>' + encodeURIComponent(q) + '</span>';
    }
  }

  input.addEventListener('input', updateQuery);
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ runSearch(); }
  });

  function runSearch(){
    var q = input.value.trim();
    if(!q) { input.focus(); return; }
    var url = 'https://www.google.com/search?q=' + encodeURIComponent(q);
    window.open(url, '_blank', 'noopener');
  }

  document.getElementById('runBtn').addEventListener('click', runSearch);
})();
</script>

</body>
</html>
